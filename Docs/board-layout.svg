<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" width="960" height="485" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="485" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">SaludWatch module layout inside the case (top-down, to scale)</text>
<text x="480" y="48" text-anchor="middle" font-size="12" fill="#666">Each deck is the inside of the case, 54 x 53 mm. Positions match hardware/case/case.scad. 5 px = 1 mm.</text>
<text x="75" y="86" font-size="14" font-weight="bold" fill="#222">Deck 1 (bottom)</text>
<text x="75" y="102" font-size="11" fill="#666">battery, charger, heart-rate sensor</text>
<rect x="75" y="110" width="270" height="265" fill="#fafafa" stroke="#333" stroke-width="2"/>
<rect x="77.5" y="112.5" width="250" height="165" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="202.5" y="193.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">LiPo 1000 mAh</text>
<text x="202.5" y="207.0" text-anchor="middle" font-size="10" fill="#5F5E5A">50 x 33 x 5 mm</text>
<rect x="77.5" y="287.5" width="125" height="85" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="140.0" y="328.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">TP4056</text>
<text x="140.0" y="342.0" text-anchor="middle" font-size="10" fill="#5F5E5A">25 x 17 x 4 mm</text>
<rect x="212.5" y="287.5" width="75" height="75" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="250.0" y="323.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#04342C">MAX30102</text>
<text x="250.0" y="337.0" text-anchor="middle" font-size="10" fill="#0F6E56">15 x 15 x 2 mm</text>
<text x="250.0" y="350.0" text-anchor="middle" font-size="10" fill="#0F6E56">faces down</text>
<rect x="67" y="312" width="8" height="36" fill="#C0392B"/>
<text x="63.0" y="334.0" text-anchor="end" font-size="10" fill="#C0392B">micro-USB</text>
<line x1="345" y1="335" x2="367" y2="335" stroke="#E08A00" stroke-width="4"/>
<text x="295.0" y="331.0" text-anchor="start" font-size="10" fill="#B36A00">DS18B20</text>
<text x="295.0" y="346.0" text-anchor="start" font-size="10" fill="#B36A00">cable exits</text>
<text x="375" y="86" font-size="14" font-weight="bold" fill="#222">Deck 2 (middle)</text>
<text x="375" y="102" font-size="11" fill="#666">ESP32, boost converter, buzzer, switch</text>
<rect x="375" y="110" width="270" height="265" fill="#fafafa" stroke="#333" stroke-width="2"/>
<rect x="377.5" y="112.5" width="235" height="125" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="495.0" y="173.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">ESP32 board</text>
<text x="495.0" y="187.0" text-anchor="middle" font-size="10" fill="#534AB7">47 x 25 x 14 mm</text>
<rect x="367" y="157" width="8" height="36" fill="#534AB7"/>
<text x="383.0" y="179.0" text-anchor="start" font-size="10" fill="#534AB7">USB-C end</text>
<rect x="377.5" y="247.5" width="185" height="85" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="470.0" y="288.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">MT3608</text>
<text x="470.0" y="302.0" text-anchor="middle" font-size="10" fill="#5F5E5A">37 x 17 x 8 mm</text>
<circle cx="600.0" cy="275.0" r="27.5" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="600.0" y="274.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A1B0C">Buzzer</text>
<text x="600.0" y="286.0" text-anchor="middle" font-size="10" fill="#993C1D">d 11 mm</text>
<rect x="572.5" y="327.5" width="70" height="45" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="607.5" y="348.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Switch</text>
<text x="607.5" y="362.0" text-anchor="middle" font-size="10" fill="#5F5E5A">14 x 9 x 10</text>
<text x="567.5" y="362.5" text-anchor="end" font-size="10" fill="#888">switch size assumed</text>
<text x="675" y="86" font-size="14" font-weight="bold" fill="#222">Deck 3 (top)</text>
<text x="675" y="102" font-size="11" fill="#666">display and buttons, under the lid</text>
<rect x="675" y="110" width="270" height="265" fill="#fafafa" stroke="#333" stroke-width="2"/>
<rect x="677.5" y="112.5" width="125" height="125" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="740.0" y="173.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A1B0C">OLED 0.96in</text>
<text x="740.0" y="187.0" text-anchor="middle" font-size="10" fill="#993C1D">25 x 25 x 12 mm</text>
<rect x="685.0" y="152.5" width="110" height="60" fill="#1b1b2f" stroke="#555" stroke-width="1"/>
<text x="740.0" y="186.5" text-anchor="middle" font-size="10" fill="#cfd3ff">screen 22 x 12</text>
<rect x="822.5" y="112.5" width="55" height="55" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="850.0" y="138.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A1B0C">Btn 1</text>
<text x="850.0" y="152.0" text-anchor="middle" font-size="10" fill="#993C1D">11 x 11</text>
<rect x="887.5" y="112.5" width="55" height="55" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="915.0" y="138.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A1B0C">Btn 2</text>
<text x="915.0" y="152.0" text-anchor="middle" font-size="10" fill="#993C1D">11 x 11</text>
<text x="822.5" y="181.0" text-anchor="start" font-size="10" fill="#666">buttons sit on a</text>
<text x="822.5" y="195.0" text-anchor="start" font-size="10" fill="#666">1.9 mm spacer</text>
<text x="30" y="403" font-size="12" fill="#333">Wires run between decks through the slot in each shelf plate. Shared rails (3V3, GND, SDA, SCL) are joined where the wires meet.</text>
<text x="30" y="423" font-size="12" fill="#333">Colored tabs on the left wall mark the charging and programming ports, and the orange line marks the temperature-probe cable.</text>
</svg>